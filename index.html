<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Narani"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Narani</title><style>
:root { --bg:#fbfaf7; --fg:#1f1e1c; --muted:#6b6862; --line:#e4e1da; --card:#fff; --accent:#2f6fd0;
  --hl:#ffe9a8; --hl2:#fff4cf; --sheet:#fff; --fs:17px; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#161615; --fg:#e8e6e1; --muted:#9a968f; --line:#33322f; --card:#1f1f1d; --accent:#7fb0ff;
    --hl:#5a4a16; --hl2:#3a3218; --sheet:#232321; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-size: var(--fs); line-height: 1.75;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere; }
a { color: var(--accent); }
[id] { scroll-margin-top: 64px; }
input.mode { position: absolute; opacity: 0; pointer-events: none; }

.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 6px;
  padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--bg);
  border-bottom: 1px solid var(--line); font-size: 15px; line-height: 1.2; }
.top-title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px;
  font: inherit; padding: 6px 9px; min-height: 34px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex: none; }
.seg label { padding: 7px 10px; min-height: 34px; color: var(--muted); cursor: pointer; user-select: none; }
.seg label + label { border-left: 1px solid var(--line); }
#m-ko:checked ~ .top label[for=m-ko], #m-en:checked ~ .top label[for=m-en],
#m-both:checked ~ .top label[for=m-both] { background: var(--fg); color: var(--bg); font-weight: 600; }
.only-js { display: none; }
.js .only-js { display: inline-block; }

main { max-width: 720px; margin: 0 auto; padding: 0 16px 45vh; }
#lib h1 { font-size: 1.15em; margin: 20px 0 8px; }
#lib ol { list-style: none; padding: 0; margin: 0 0 32px; }
#lib li a { display: block; padding: 12px 14px; margin: 8px 0; background: var(--card); color: var(--fg);
  border: 1px solid var(--line); border-radius: 12px; text-decoration: none; line-height: 1.45; }
.li-title { display: block; font-weight: 600; }
.li-en { display: block; color: var(--muted); font-size: .85em; margin-top: 2px; }
.li-meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .8em; margin-top: 6px; }
.badge { margin-left: auto; flex: none; white-space: nowrap; border: 1px solid var(--line); border-radius: 999px;
  padding: 0 8px; }

.paper { border-top: 1px solid var(--line); padding-top: 8px; }
.ph-meta { color: var(--muted); font-size: .85em; margin: 10px 0 4px; }
.note { font-size: .85em; color: var(--muted); background: var(--card); border: 1px dashed var(--line);
  border-radius: 8px; padding: 6px 10px; }
.toc { margin: 8px 0 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
.toc summary { padding: 9px 12px; cursor: pointer; font-weight: 600; font-size: .9em; }
.toc ol { list-style: none; margin: 0; padding: 0 12px 10px; font-size: .9em; line-height: 1.5; }
.toc li { padding: 4px 0; } .toc li.l3 { padding-left: 14px; } .toc li.l4 { padding-left: 28px; }
.toc a { color: var(--fg); text-decoration: none; }
.end, .stamp { text-align: center; color: var(--muted); font-size: .8em; margin: 32px 0; }

/* 본문 */
.row.sec { margin-top: 1.2em; }
.cell h1 { font-size: 1.45em; line-height: 1.35; margin: .6em 0 .4em; }
.cell h2 { font-size: 1.22em; line-height: 1.4; margin: 1.2em 0 .4em; }
.cell h3, .cell h4, .cell h5, .cell h6 { font-size: 1.06em; margin: 1em 0 .3em; }
.cell p { margin: 0 0 .9em; }
.cell img { display: block; max-width: 100%; height: auto; margin: 10px auto; border-radius: 4px; background: #fff; }
.cell blockquote { margin: 0 0 1em; padding: 2px 0 2px 12px; border-left: 3px solid var(--line);
  color: var(--muted); font-size: .9em; }
.cell table { display: block; overflow-x: auto; border-collapse: collapse; font-size: .82em; margin: 0 0 1em;
  max-width: 100%; }
.cell th, .cell td { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
.cell pre { overflow-x: auto; font-size: .82em; background: var(--card); padding: 10px; border-radius: 8px; }
.cell code { font-size: .9em; }
/* 수식은 줄을 바꾸지 못한다 — 화면보다 길면 감싼 상자(.mx)만 가로로 스크롤한다(_wrap_math) */
.cell .mx { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
.cell .math.block .mx { display: block; margin: .6em 0; }
/* 그래도 무언가 넘치면 본문 밖으로는 못 나가게 — 페이지가 가로로 밀리지 않는다 */
main { overflow-x: clip; }
.cell ul, .cell ol { padding-left: 1.3em; margin: 0 0 .9em; }
.cell a[href*="-ref-"], .cell sup a { text-decoration: none; border-bottom: 1px dotted currentColor; }
.cell sup { line-height: 0; }
.cell .md-math-raw { white-space: pre-wrap; }

/* 보기 모드 — 번역 / 원문 / 문단 대조 (JS 없이 CSS로만).
   펼친 문단(.peek)은 숨기는 규칙보다 우선해야 한다 — 숨기는 규칙이 #id를 품고 있어서 펼치는 쪽도
   같은 #id로 시작하고 클래스를 하나 더 얹어 이긴다. */
#m-ko:checked ~ main .paper.has-ko .cell.en { display: none; }
#m-en:checked ~ main .cell.ko { display: none; }
#m-both:checked ~ main .paper.noalign .cell.en { display: none; }
#m-ko:checked ~ main .paper .row.peek .cell.en, #m-en:checked ~ main .paper .row.peek .cell.ko { display: block; }
/* 아래에 붙는 쪽(대조 모드의 원문, 펼친 문단의 상대 언어)은 옅게 · 왼쪽 선 */
#m-both:checked ~ main .paper.has-ko:not(.noalign) .cell.en,
#m-ko:checked ~ main .paper .row.peek .cell.en, #m-en:checked ~ main .paper .row.peek .cell.ko {
  font-size: .9em; color: var(--muted); border-left: 3px solid var(--line); padding-left: 11px; margin: -.3em 0 1.2em; }
/* 원문 모드에서 펼친 번역은 원문 '아래'로 (DOM은 번역이 먼저다) */
#m-en:checked ~ main .paper .row.peek .cell.ko { order: 2; margin: .2em 0 1.2em; }
#m-both:checked ~ main .cell.en img, #m-ko:checked ~ main .paper .row.peek .cell.en img { display: none; }
#m-both:checked ~ main .cell.en :is(h1, h2, h3, h4, h5, h6),
#m-ko:checked ~ main .paper .row.peek .cell.en :is(h1, h2, h3, h4, h5, h6) { font-size: 1.05em; margin-top: .2em; }
.row.peek { display: flex; flex-direction: column; background: var(--hl2); border-radius: 8px; margin: 0 -8px;
  padding: 4px 8px 1px; }

/* JS가 켜지면 — 목록 화면과 논문 한 편씩 */
.js .paper { display: none; border: 0; }
.js .paper.on { display: block; }
.js #lib.off, .js .end { display: none; }
.sent { border-radius: 3px; -webkit-tap-highlight-color: transparent; }
.sent.on { background: var(--hl); }

#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-height: 55vh; overflow-y: auto;
  background: var(--sheet); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
  box-shadow: 0 -6px 24px rgba(0,0,0,.14); padding: 6px 18px calc(14px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .18s ease; visibility: hidden; }
#sheet.open { transform: none; visibility: visible; }
.sh-grip { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 10px; }
.sh-label { font-size: .75em; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin-bottom: 4px; }
.sh-text { font-size: .95em; line-height: 1.65; }
.sh-text .more { color: var(--muted); font-size: .9em; margin-top: 6px; }
.sh-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.sh-acts a, .sh-acts button { border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 9px; padding: 7px 12px; font: inherit; font-size: .85em; text-decoration: none; }

/* 화면 전체 확대(핀치·두 번 누르기)는 막는다 — 글자는 '가' 단추로, 그림·표는 눌러서 전체 화면(#zv)에서 키운다 */
html { touch-action: pan-x pan-y; }
.top button { white-space: nowrap; }
.top .back { font-size: 1.3em; line-height: 1; }
/* 그림 단추(뒤로·목차·공유)는 34px 정사각형 — 뒤로·목차는 테두리 없이(이동 단추), 공유는 다른 단추들처럼 테두리 */
.top .back, .top .tb.tocb, .top .tb.sh { width: 34px; height: 34px; min-height: 34px; padding: 0; flex: none; }
.top .back, .top .tb.tocb { border-color: transparent; background: none; }
.js.reading .top .back { display: grid; place-items: center; }
.js.reading .top .tb.rd { display: inline-block; }
.top .tb.rd, #fab.rd { display: none; }
/* 제목 — 두 줄까지. 논문을 열었을 때는 누르면 목차(▾) */
.top .top-title { border: 0; background: none; min-height: 0; padding: 2px 2px; text-align: left; color: var(--fg);
  font: inherit; font-weight: 600; font-size: .92em; line-height: 1.25; white-space: normal; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.js.reading .top .top-title { position: relative; }
/* 목차 — 제목 왼쪽의 ☰ 단추(제목을 눌러도 열린다). 본문 머리의 접힌 목차는 이 서랍과 겹쳐 숨긴다(서랍이 그것을 읽어 그린다) */
.top .tb.tocb { display: none; }
.js.reading .top .tb.tocb { display: inline-grid; place-items: center; }
.js .paper .toc { display: none; }
.top #lang-btn { font-weight: 600; min-width: 64px; }
/* 키보드가 올라오면 아래 시트·대화 창을 그 위로 (--kb: 키보드 높이, visualViewport로 잰다) */
#sheet { bottom: var(--kb, 0px); max-height: min(55vh, calc(100vh - var(--kb, 0px) - 70px)); }
.pop { position: absolute; right: 10px; top: calc(100% + 4px); display: none; gap: 6px; padding: 6px; z-index: 6;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.pop.open { display: flex; }
#tocd-fold { display: none; place-items: center; flex: none; padding: 4px; }
/* 논문 메모 탭 — 메모 창 위쪽, 대화의 '메모로' 단추 */
.memos { margin: 0 0 12px; }
details.memo { border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin: 0 0 8px; }
details.memo summary { padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: .9em; }
details.memo .pend { margin-left: 8px; font-weight: 400; font-size: .8em; color: var(--accent); }
.memo-md { padding: 0 12px 8px; font-size: .9em; line-height: 1.6; }
.memo-md p { margin: 0 0 .6em; } .memo-md ul, .memo-md ol { margin: 0 0 .6em; padding-left: 1.2em; }
.memo-pre { max-height: 32vh; overflow-y: auto; white-space: pre-wrap; font-size: .85em; color: var(--muted); border-left: 3px solid var(--line);
  padding: 2px 0 2px 10px; margin: 0 0 10px; }
.memo-md.memo-pre { white-space: normal; color: var(--fg); }
.memo-new { width: 100%; font: inherit; font-size: 16px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--fg); margin: 0 0 8px; }
#ag-body .to-memo { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; border: 1px solid var(--line); background: var(--card);
  color: var(--muted); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: .78em; }
#rw { display: none; position: fixed; top: 50%; z-index: 7; width: 16px; height: 72px; margin-top: -36px; cursor: ew-resize; touch-action: none; }
#rw::after { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 4px; border-radius: 2px; background: var(--line);
  transition: background .12s; }
#rw:hover::after, #rw.drag::after { background: var(--accent); }
/* 공유 — 단추는 내 Drive에 연결됐을 때만, 공유받은 화면은 그 한 편만(목록·뒤로 없음) */
.top .tb.sh { display: none !important; }
.js.reading.can-share .top .tb.sh { display: inline-grid !important; place-items: center; }
.shared #back, .shared #lib { display: none !important; }
.share-note { margin: 12px 0 4px; }
.share-link { word-break: break-all; user-select: all; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 64px); transform: translateX(-50%); z-index: 25;
  background: var(--fg); color: var(--bg); border-radius: 999px; padding: 8px 16px; font-size: .85em; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.pop-sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 2px; }
.pop .ff.on { background: var(--hl2); border-color: var(--accent); }
#ff-serif { font-family: Georgia, "AppleMyungjo", "Batang", serif; }
.paper { font-family: var(--ff, inherit); }
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 11; opacity: 0; pointer-events: none;
  transition: opacity .18s ease; }
#scrim.open { opacity: 1; pointer-events: auto; }
.dh { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line);
  font-weight: 600; font-size: .95em; }
.dh span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 1.2em; padding: 2px 6px; }
#tocd { position: fixed; top: 0; bottom: 0; left: 0; width: min(84vw, 340px); z-index: 12; background: var(--bg);
  border-right: 1px solid var(--line); transform: translateX(-102%); transition: transform .2s ease;
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
#tocd.open { transform: none; }
#tocd ol { list-style: none; margin: 0; padding: 6px 0 calc(24px + env(safe-area-inset-bottom)); overflow-y: auto;
  font-size: .92em; line-height: 1.45; }
#tocd li a { display: block; padding: 8px 16px; color: var(--fg); text-decoration: none; }
#tocd li.l3 a { padding-left: 30px; } #tocd li.l4 a { padding-left: 44px; }
#tocd .tocd-tabs { padding: 0 8px 0 12px; }
#tocd .tocd-tabs .ag-tabs { max-width: none; margin: 0; }
#tocd ol.figs li a { display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px; }
#tocd ol.figs .th { flex: none; width: 64px; height: 48px; border-radius: 6px; border: 1px solid var(--line); background: #fff;
  display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 1.3em; }
#tocd ol.figs .th img { width: 100%; height: 100%; object-fit: contain; }
#tocd ol.figs .tx { min-width: 0; font-size: .88em; }
#tocd ol.figs .tx strong { display: block; }
#tocd ol.figs .cap { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); }
a.figref { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; }
/* 읽던 자리로 — 건너뛴 뒤 아래 가운데 알약 */
#jback { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 9;
  display: none; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: var(--fg); color: var(--bg);
  font: inherit; font-size: .9em; font-weight: 600; padding: 9px 16px; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.js.reading #jback.on { display: flex; }
.js.reading.listening #jback { bottom: calc(212px + env(safe-area-inset-bottom)); }
.js.talking #jback { display: none !important; }
#tocd li.here a { background: var(--hl2); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
#fab { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 8; width: 52px; height: 52px;
  border-radius: 50%; border: 0; background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.js.reading #fab.rd { display: grid; place-items: center; }
#agent { position: fixed; left: 0; right: 0; bottom: var(--kb, 0px); height: min(86vh, calc(100vh - var(--kb, 0px) - 40px)); z-index: 12; background: var(--sheet);
  border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18); display: flex; flex-direction: column;
  transform: translateY(105%); transition: transform .2s ease; visibility: hidden; }
#agent.open { transform: none; visibility: visible; }
#ag-body { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: .95em; line-height: 1.6; }
#ag-body .m { margin: 0 0 12px; white-space: pre-wrap; }
#ag-body .m.u { margin-left: 18%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
#ag-body .m.a { white-space: normal; } #ag-body .m.a p { margin: 0 0 .6em; } #ag-body .m.a ul { margin: 0 0 .6em; padding-left: 1.2em; }
#ag-body .m.err { color: #b3261e; }
#ag-body .hint { color: var(--muted); font-size: .9em; }
#ag-body a.rr { text-decoration: none; border-bottom: 1px dotted currentColor; font-size: .85em; }
#ag-body label { display: block; font-size: .8em; color: var(--muted); margin: 12px 0 4px; }
#ag-body select, #ag-body input { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
#ag-body .acts { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
#ag-body .acts button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 9px;
  font: inherit; font-size: .9em; padding: 8px 14px; }
#ag-body .acts button.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
#ag-form { display: flex; gap: 8px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
#ag-in { flex: 1; font: inherit; font-size: 16px; color: var(--fg); background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 8px 14px; resize: none; max-height: 30vh; }
#ag-send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 1.1em;
  align-self: flex-end; }
#ag-send:disabled { opacity: .45; }
.row.flash { animation: rowFlash 1.6s ease-out; }
@keyframes rowFlash { 0%, 50% { background: var(--hl2); } 100% { background: transparent; } }
.lib-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0 6px; color: var(--muted);
  font-size: .8em; line-height: 1.4; }
.lib-bar .grow { flex: 1; min-width: 12em; }
.lib-bar button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 9px;
  font: inherit; padding: 6px 10px; min-height: 32px; }
.lib-bar button:disabled { opacity: .55; }
.badge.off { border-style: dashed; }
.li-by { display: flex; gap: 5px; color: var(--muted); font-size: .8em; margin-top: 6px; white-space: nowrap; min-width: 0; }
.li-by .who { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.li-by .sep, .li-by .when { flex: none; }
.li-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.li-tags .tag { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-size: .75em; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-variant-numeric: tabular-nums; }
.li-tags .tag.au { color: var(--accent); border-color: currentColor; }
#loading { color: var(--muted); text-align: center; margin: 30vh 0 0; font-size: .95em; }
#lib .empty { color: var(--muted); font-size: .9em; padding: 12px 2px; }
.lib-foot { color: var(--muted); font-size: .8em; text-align: center; margin: 8px 0 24px; }
.lib-bar button.re { width: 36px; height: 36px; padding: 0; border-radius: 50%; font-size: 1.25em; line-height: 1; }
.lib-opts { display: flex; flex-direction: column; gap: 10px; margin: 18px 2px 4px; padding-top: 14px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: .82em; }
.lib-opts:empty { display: none; }
.lib-opts label.auto { display: flex; align-items: center; gap: 8px; }
.lib-opts label.auto input { width: 18px; height: 18px; margin: 0; flex: none; }
.lib-foot a { color: var(--muted); }

/* 하이라이트 — 데스크톱 뷰어와 같은 색. 글자는 형광 위라 늘 어둡게 */
mark.anno { color: #24211c; border-radius: 2px; padding: 0; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.c-yellow { background: #ffe08a; } .c-green { background: #b5e7b8; } .c-blue { background: #a9d8f5; }
.c-pink { background: #f9bcd4; } .c-purple { background: #d8c6f5; }
mark.anno.note-end::after { content: "✎"; font-size: .75em; margin-left: 2px; color: #6b5a2a; }
.anno-dots { display: flex; gap: 12px; margin: 12px 0 2px; }
.anno-dots .dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid rgba(0,0,0,.12); padding: 0; }
.anno-dots .dot.on { border-color: var(--fg); box-shadow: 0 0 0 2px var(--sheet) inset; }
.anno-note { margin-top: 10px; padding: 8px 10px; background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; font-size: .9em; white-space: pre-wrap; }
.anno-ta { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--card);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
/* 옆 칸의 탭 — 목차 | 그림·표, 메모 | 질문하기. 칸 머리 밑줄에 붙은 밑줄 탭(고른 탭만 파란 밑줄)으로 두 칸이 같은 꼴 */
.dh:has(.ag-tabs) { padding-top: 0; padding-bottom: 0; height: 48px; flex: none; }
.ag-tabs { flex: 1; display: flex; align-self: stretch; min-width: 0; max-width: 320px; margin-right: auto; gap: 2px; }
.dh .ag-tabs button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 0;
  font-size: .9em; font-weight: 600; color: var(--muted); padding: 0 8px; border-radius: 0; white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.dh .ag-tabs button:hover { color: var(--fg); }
.dh .ag-tabs button svg { flex: none; }
.dh .ag-tabs .cnt { flex: none; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff;
  font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.dh .ag-tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
#agent.notes #ag-clear, #agent.notes #ag-set { display: none; }
#fab-n { position: absolute; top: -3px; right: -3px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px;
  background: var(--fg); color: var(--bg); font-size: 12px; font-weight: 700; line-height: 20px; display: none; }
#fab-n.on { display: block; }
.nl-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 4px; color: var(--muted); font-size: .85em; }
.nl-bar .grow { flex: 1; }
.nl-bar button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 9px;
  font: inherit; padding: 5px 10px; }
.nl-bar button.on { background: var(--hl2); border-color: var(--accent); }
ol.nl { list-style: none; margin: 0; padding: 0; }
ol.nl li { padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
ol.nl .aq { border-radius: 3px; padding: 1px 4px; color: #24211c; font-size: .92em; box-decoration-break: clone;
  -webkit-box-decoration-break: clone; }
ol.nl .an { display: block; margin: 5px 0 0 4px; white-space: pre-wrap; }
ol.nl .al { display: block; color: var(--muted); font-size: .8em; margin-top: 3px; }
/* 듣기 — 🎧는 💬 위에, 재생 막대는 맨 아래(💬·🎧는 그 위로 올라간다). 지금 문장은 ::highlight(tts) */
#lis { position: fixed; right: 20px; bottom: calc(82px + env(safe-area-inset-bottom)); z-index: 8; width: 44px; height: 44px;
  border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--accent); display: none;
  box-shadow: 0 4px 14px rgba(0,0,0,.14); }
.js.reading.has-audio:not(.listening) #lis { display: grid; place-items: center; }
#player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: none; background: var(--card);
  border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.1); padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
.js.reading.listening #player { display: block; }
.js.reading.listening #fab.rd { bottom: calc(200px + env(safe-area-inset-bottom)); }
.js.reading.listening main { padding-bottom: 214px; }
/* 재생 막대 — 차 안·걸으면서 누르기 쉽게 크게: 단추는 48px 이상, 재생 64px, 막대 손잡이 26px */
.pl-top { display: flex; gap: 4px; align-items: center; font-size: .92em; color: var(--muted); }
.pl-top button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; min-width: 44px; min-height: 40px;
  padding: 0 8px; border-radius: 10px; }
.pl-top button:active { background: var(--hl2); }
#pl-x { font-size: 1.35em; font-weight: 400; }
#pl-sec { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; color: var(--fg); }
.pl-t { display: flex; justify-content: space-between; margin: -4px 4px 2px; font-size: .8em; color: var(--muted); font-variant-numeric: tabular-nums; }
#pl-seek { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; margin: 2px 0; background: transparent; touch-action: none; }
#pl-seek::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line); }
#pl-seek::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%;
  background: var(--accent); border: 3px solid var(--card); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
#pl-seek::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
#pl-seek::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--card); }
.pl-ctl { display: flex; justify-content: space-evenly; align-items: center; }
.pl-ctl button { border: 0; background: none; color: var(--fg); font: inherit; font-size: 1.2em; font-weight: 600; min-width: 56px; min-height: 56px;
  padding: 4px; border-radius: 12px; display: grid; place-items: center; }
.pl-ctl button:active { background: var(--hl2); }
.pl-ctl button svg { width: 30px; height: 30px; }
#pl-pp { flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 1.6em; }
#pl-pp:active { background: var(--accent); filter: brightness(.9); transform: scale(.96); }
#pl-pp { box-shadow: 0 4px 12px rgba(35,131,226,.35); transition: transform .08s; }
#pl-pp svg { width: 30px; height: 30px; }
#pl-range, #pl-spd { font-size: .95em; }
/* 목소리 단추 — 폰 내장 음성일 때, 또는 데스크톱 음성과 둘 중 고를 수 있을 때만 */
#pl-voice { display: none; font-size: 1.05em; }
.web-tts #pl-voice, .two-eng #pl-voice { display: inline-grid; place-items: center; }
.rng .wv { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.rng .wv-sel { flex: 1; min-width: 0; font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
::highlight(tts) { background-color: rgba(255, 196, 0, .45); }
/* 말로 묻기 — 막대의 🎙, 대화 중 상태 막대(재생 막대 위·없으면 아래) */
/* 듣는 중엔 떠 있는 💬 단추가 '🎙 묻기' 알약으로 바뀐다(메모·질문하기 창은 막대를 닫고) */
#fab-ask { display: none; align-items: center; gap: 6px; font: inherit; font-weight: 700; font-size: 1em; }
.js.reading.listening #fab.rd { width: auto; padding: 0 18px 0 14px; border-radius: 26px; }
.js.reading.listening #fab .fab-c, .js.reading.listening #fab-n { display: none; }
.js.reading.listening #fab-ask { display: flex; }
#ag-mic { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--fg);
  align-self: flex-end; display: grid; place-items: center; padding: 0; }
/* 그림 단추들(설정·지우기·목소리·새로 고침·보내기) — 이모지 대신 같은 선 굵기의 SVG */
#ag-set, #ag-clear, #ag-send, .lib-bar button.re { display: inline-grid; place-items: center; }
#ag-set svg, #ag-clear svg { display: block; }
.vmic { display: inline-block; vertical-align: -2px; margin-right: 4px; opacity: .7; }
#talkbar { position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 13; display: none;
  align-items: center; gap: 8px; background: var(--fg); color: var(--bg); border-radius: 16px; padding: 10px 10px 10px 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.25); font-weight: 600; }
.js.reading.listening #talkbar { bottom: calc(200px + env(safe-area-inset-bottom)); }
#talkbar.on { display: flex; }
#talkbar .lv { width: 12px; height: 12px; border-radius: 50%; background: #9a968e; flex: none; }
#talkbar.listening .lv { background: #4caf50; animation: tkPulse 1.2s infinite; } #talkbar.speaking .lv { background: #6aa0ff; }
#talkbar.thinking .lv { background: #e6a700; }
@keyframes tkPulse { 50% { transform: scale(1.35); opacity: .6; } }
#tk-st { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tk-meta { font-weight: 400; font-size: .8em; opacity: .7; font-variant-numeric: tabular-nums; }
#tk-end { border: 0; border-radius: 999px; background: #c4554d; color: #fff; font: inherit; padding: 6px 14px; }
#talkbar:not(.listening):not(.speaking):not(.thinking) #tk-end { display: none; }
.js.talking #fab.rd, .js.talking #lis { display: none; }   /* 대화 중엔 대화 막대만 */
.row.tts-row { background: var(--hl2); border-radius: 6px; }
.js.listening .row.tts-off { opacity: .35; transition: opacity .2s; }   /* 음성에 없는 행 — 듣는 동안 흐리게 */
.rng label { display: block; margin: 6px 0; }
.rng-secs { margin: 4px 0 0 22px; max-height: 32vh; overflow-y: auto; font-size: .9em; }
/* 새 판 알림 — 읽는 중일 때만 (목록에선 바로 다시 연다) */
#upd { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 60px); transform: translateX(-50%); z-index: 20;
  display: none; align-items: center; gap: 8px; background: var(--fg); color: var(--bg); border-radius: 999px;
  padding: 6px 8px 6px 14px; font-size: .85em; box-shadow: 0 6px 18px rgba(0,0,0,.2); white-space: nowrap; }
#upd.on { display: flex; }
#upd button { border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; padding: 5px 12px; }
/* 그림·표 전체 화면 — 두 손가락으로 키우고 끌어 옮긴다(본문 화면은 그대로) */
#zv { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,calc(.94 * var(--zv-a, 1))); touch-action: none;
  overflow: hidden; -webkit-user-select: none; user-select: none; }
#zv .zv-box { position: absolute; left: 0; top: 0; width: max-content; transform-origin: 0 0; }
#zv .zv-box img { display: block; background: #fff; border-radius: 2px; -webkit-user-drag: none; }
#zv .zv-box table { border-collapse: collapse; background: #fff; color: #111; font-size: 15px; line-height: 1.4; }
#zv .zv-box th, #zv .zv-box td { border: 1px solid #ccc; padding: 4px 8px; vertical-align: top; }
#zv .zv-x, #zv .zv-zm button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgba(60,60,60,.7);
  color: #fff; font-size: 26px; line-height: 1; padding: 0; }
#zv .zv-x { position: absolute; top: calc(env(safe-area-inset-top) + 10px); right: 12px; }
#zv .zv-zm { position: absolute; top: calc(env(safe-area-inset-top) + 10px); left: 12px; display: flex; gap: 10px; }
#zv .zv-zm button:disabled { opacity: .35; }
#zv .zv-cap { position: absolute; left: 0; right: 0; bottom: 0; max-height: 30vh; overflow-y: auto; touch-action: pan-y;
  padding: 22px 16px calc(14px + env(safe-area-inset-bottom)); color: #eee; font-size: .88em; line-height: 1.5;
  background: linear-gradient(transparent, rgba(0,0,0,.7) 20px); transition: opacity .2s; }
#zv.zoomed .zv-cap { opacity: 0; pointer-events: none; }

/* ---- 넓은 화면(데스크톱 브라우저) — 늘인 폰 화면이 아니라 뷰어로: 목록은 카드 격자, 논문은 가운데 읽기 칸 +
   왼쪽 목차 칸(늘 보임) + 오른쪽 메모·질문 칸(열면). 떠 있는 것들(재생 막대·시트·알약)은 읽기 칸 가운데에.
   --sl·--sr: 양쪽 칸 너비 — 떠 있는 것들이 그만큼 비켜 선다. 데스크톱 앱 뷰어처럼 원문 | 번역을 나란히 볼 수 있다 */
@media (min-width: 1100px) {
  .js main { max-width: 1180px; padding: 0 32px 45vh; }
  #lib h1 { font-size: 1.5em; margin: 28px 0 6px; }
  #lib ol { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  #lib li a { margin: 0; height: 100%; padding: 16px 18px; transition: border-color .12s, box-shadow .12s; }
  .lib-opts, .lib-foot { max-width: 560px; }
  .lib-foot { text-align: left; }
  .js.reading { --sl: 300px; --sr: 0px; padding-left: var(--sl); }
  .js.reading:has(#agent.open) { --sr: 420px; padding-right: var(--sr); }
  .js.reading main { padding-right: 88px; padding-left: 40px; }   /* 오른쪽은 떠 있는 💬·🎧 자리 */
  /* 목차 칸은 ☰·× 로 접고 편다(접은 채로 기억) */
  .js.reading.toc-off { --sl: 0px; }
  .js.reading.toc-off #tocd { transform: translateX(-102%); }
  /* 위 막대와 목차 칸 머리를 같은 높이(52px)로 — 두 밑줄이 한 줄로 이어진다 */
  .js.reading .top { height: 52px; padding-top: 0; padding-bottom: 0; }
  .js.reading #tocd .tocd-tabs, #agent > .dh { height: 52px; }   /* 위 막대와 같은 높이 */
  /* 논문 제목은 위 막대에 있다 — 제목·× 줄은 빼고, 목차|그림·표 칸 옆의 « 로 접는다 */
  .js.reading #tocd > .dh:first-child { display: none; }
  .js.reading #tocd-fold { display: grid; }
  .js.reading main { max-width: var(--rw1, 800px); }
  .js.reading:has(#m-both:checked) main { max-width: var(--rw2, 1320px); }
  /* 본문 너비 막대 — 읽기 칸 오른쪽 끝을 끌어 넓히고 좁힌다(두 번 누르면 처음 너비) */
  .js.reading #rw { display: block; }

  #scrim { display: none; }
  .js.reading #tocd { width: var(--sl); transform: none; transition: none; box-shadow: none; }
  .js.reading .top .top-title::after { content: none; }
  #agent { left: auto; top: 0; right: 0; bottom: 0; width: 420px; height: auto; border-radius: 0; border-left: 1px solid var(--line);
    box-shadow: none; transform: translateX(102%); }
  #agent.open { transform: none; }
  /* 떠 있는 것들 — 읽기 칸 가운데(양쪽 칸을 뺀 자리) */
  #sheet { left: calc(var(--sl, 0px) + (100% - var(--sl, 0px) - var(--sr, 0px)) / 2); right: auto;
    width: min(640px, calc(100% - var(--sl, 0px) - var(--sr, 0px) - 48px)); bottom: calc(20px + var(--kb, 0px));
    border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 36px rgba(0,0,0,.16); transform: translate(-50%, calc(100% + 40px)); }
  #sheet.open { transform: translate(-50%, 0); }
  .js.reading.listening #sheet { bottom: 214px; }
  #player { left: calc(var(--sl, 0px) + (100% - var(--sl, 0px) - var(--sr, 0px)) / 2); right: auto; transform: translateX(-50%);
    width: min(680px, calc(100% - var(--sl, 0px) - var(--sr, 0px) - 48px)); bottom: 16px; border: 1px solid var(--line);
    border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.14); padding-bottom: 10px; }
  #jback { left: calc(var(--sl, 0px) + (100% - var(--sl, 0px) - var(--sr, 0px)) / 2); }
  #talkbar { left: calc(var(--sl, 0px) + 24px); right: calc(var(--sr, 0px) + 24px); max-width: 680px; margin: 0 auto; }
  #fab { right: calc(var(--sr, 0px) + 28px); bottom: 28px; }
  #lis { right: calc(var(--sr, 0px) + 32px); bottom: 92px; }
  .js.reading.listening #fab.rd { bottom: 214px; }
  /* 나란히 — 원문 | 번역 (데스크톱 앱 뷰어처럼 원문이 왼쪽). 한 행의 두 셀이 같은 줄이라 높이가 맞는다 */
  .js #m-both:checked ~ main .paper.has-ko:not(.noalign) .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    column-gap: 36px; }
  .js #m-both:checked ~ main .paper.has-ko:not(.noalign) .row > .cell.en { order: 1; font-size: inherit; color: inherit;
    border-left: 0; padding-left: 0; margin: 0; }
  .js #m-both:checked ~ main .paper.has-ko:not(.noalign) .row > .cell.ko { order: 2; }
  .js #m-both:checked ~ main .paper.has-ko:not(.noalign) .row > .cell.same { grid-column: 1 / -1; }
  .js #m-both:checked ~ main .cell.en :is(h1, h2, h3, h4, h5, h6) { font-size: revert; margin-top: revert; }
  #m-both:checked ~ main .cell.en img { display: block; }
}
@media (min-width: 1100px) and (hover: hover) {
  #lib li a:hover { border-color: var(--accent); box-shadow: 0 6px 20px rgba(0,0,0,.08); }
  .top button:hover, .lib-bar button:hover, .pl-top button:hover, .pl-ctl button:not(#pl-pp):hover, .dh button:hover { background: var(--hl2); }
  #tocd li a:hover { background: var(--hl2); }
  button, label, #tocd a { cursor: pointer; }
}
/* 오프라인 — 받아 두지 않은 논문은 흐리게 */
#lib-list li.na a { opacity: .45; }
